[platformio]
default_envs = dashboard
src_dir = .

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    zinggjm/GxEPD2@1.6.9

[env:dashboard]
build_src_filter = +<src/>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@7.4.3
    olikraus/U8g2_for_Adafruit_GFX@1.8.0

[env:pantalla]
build_src_filter = +<examples/pantalla/>

[env:solo_esp32]
build_src_filter = +<examples/solo_esp32/>

[env:legacy_esp32_hat]
build_src_filter = +<examples/legacy_esp32_hat/>
